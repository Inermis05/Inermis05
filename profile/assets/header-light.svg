<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <style>
    .t {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo",
                   "Pretendard", "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Malgun Gothic", sans-serif;
    }
    .eyebrow { font-size: 22px; font-weight: 600; letter-spacing: 0.2px; fill: #0071e3; }
    .title   { font-size: 76px; font-weight: 700; letter-spacing: -2px;  fill: #1d1d1f; }
    .sub     { font-size: 28px; font-weight: 400; letter-spacing: -0.2px; fill: #86868b; }

    /* 애플 제품 페이지 같은 은은한 fade-up. 모션 줄이기 설정 사용자는 정지 상태로 보임 */
    @media (prefers-reduced-motion: no-preference) {
      .a { animation: up 0.9s cubic-bezier(.2,.7,.2,1) both; }
      .d1 { animation-delay: 0.05s; }
      .d2 { animation-delay: 0.2s; }
      .d3 { animation-delay: 0.35s; }
    }
    @keyframes up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- 텍스트 3줄만 바꾸면 됩니다 -->
  <text class="t eyebrow a d1" x="600" y="104" text-anchor="middle">Software Engineer</text>
  <text class="t title a d2"   x="600" y="192" text-anchor="middle">Hi, I'm Your Name.</text>
  <text class="t sub a d3"     x="600" y="248" text-anchor="middle">Building simple things, carefully.</text>
</svg>
